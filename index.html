<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal academic website with bilingual content." />
  <title>Academic Website</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --paper: #fffdfa;
      --ink: #2c2c2c;
      --ink-soft: #66645e;
      --line: #ddd8cd;
      --primary: #667a69;
      --secondary: #8a7868;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(44, 44, 44, 0.06);
      --container: 1120px;
      --sans: "Inter", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
      --serif: "Noto Serif TC", "Source Serif 4", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--sans);
      line-height: 1.75;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(92%, var(--container));
      margin-inline: auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
      background: color-mix(in srgb, var(--bg) 90%, white);
    }

    .header-row {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 10px 0;
    }

    .site-name {
      font-family: var(--serif);
      font-size: 1.1rem;
      letter-spacing: 0.03em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      color: var(--ink-soft);
      font-size: 0.94rem;
      flex-wrap: wrap;
    }

    .nav-links a { padding: 0.25rem 0.2rem; }
    .nav-links a:hover { color: var(--ink); }

    .lang-control {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      padding: 4px;
      margin-left: 0.2rem;
    }

    .lang-control button {
      border: 0;
      background: transparent;
      border-radius: 999px;
      padding: 0.38rem 0.72rem;
      font-size: 0.82rem;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .lang-control button.active {
      background: var(--primary);
      color: #fff;
    }

    main { padding: 2rem 0 4rem; }

    .hero {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 1.4rem;
      align-items: stretch;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.3rem;
    }

    .hero h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.25;
    }

    .hero-subtitle {
      color: var(--ink-soft);
      margin-top: 0.35rem;
      font-size: 1.02rem;
    }

    .hero-statement {
      margin-top: 0.95rem;
      font-size: 1.04rem;
      max-width: 62ch;
    }

    .button-row {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.58rem 1.05rem;
      font-size: 0.9rem;
      background: #fff;
    }

    .btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .hero-meta ul {
      margin: 0;
      padding-left: 1.1rem;
      color: var(--ink-soft);
    }

    section { margin-top: 1.2rem; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.8rem;
      margin-bottom: 0.65rem;
    }

    .section-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.35rem, 2.7vw, 1.95rem);
    }

    .section-head p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.92rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .topic h3,
    .teaching-item h3 {
      margin: 0;
      font-size: 1rem;
    }

    .topic p,
    .teaching-item p,
    .pub-item p,
    .news-item p {
      margin: 0.45rem 0 0;
      color: var(--ink-soft);
      font-size: 0.94rem;
    }

    .pub-item {
      padding: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: #fff;
    }

    .pub-item + .pub-item { margin-top: 0.55rem; }

    .pub-links {
      margin-top: 0.45rem;
      display: flex;
      gap: 0.8rem;
      font-size: 0.86rem;
      color: var(--secondary);
    }

    .news-list { display: grid; gap: 0.55rem; }

    .news-item {
      padding: 0.8rem 1rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .contact-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      color: var(--ink-soft);
      font-size: 0.92rem;
    }

    footer {
      border-top: 1px solid var(--line);
      margin-top: 1.4rem;
      padding-top: 1rem;
    }

    @media (max-width: 940px) {
      .hero { grid-template-columns: 1fr; }
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 700px) {
      .grid-3,
      .grid-2 { grid-template-columns: 1fr; }
      .nav-links { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">

      <div class="site-name" id="siteName">{{Your Name}}</div>
      <nav class="nav-links">

        <a href="#news" data-i18n="nav_news"></a>

          <button type="button" data-lang="zh">中文</button>

  </header>

  <main class="container">
    <section class="hero" id="home">
      <article class="card">

          <a class="btn" href="#contact" data-i18n="cta_contact"></a>
        </div>
      </article>
      <aside class="card hero-meta">
        <h2 data-i18n="meta_title"></h2>
        <ul>
          <li id="meta1"></li>
          <li id="meta2"></li>
          <li id="meta3"></li>
          <li id="meta4"></li>
        </ul>
      </aside>
    </section>

    <section id="research">
      <div class="section-head">
        <h2 data-i18n="research_title"></h2>
        <p data-i18n="research_subtitle"></p>
      </div>
      <div class="grid-3">
        <article class="card topic">
          <h3 id="topic1"></h3>
          <p id="topic1_desc"></p>
        </article>
        <article class="card topic">
          <h3 id="topic2"></h3>
          <p id="topic2_desc"></p>
        </article>
        <article class="card topic">

          <p id="topic3_desc"></p>
        </article>
      </div>
    </section>

    <section id="publications" class="card">
      <div class="section-head">
        <h2 data-i18n="publications_title"></h2>
        <p data-i18n="publications_subtitle"></p>
      </div>
      <article class="pub-item">
        <strong id="pub1_title"></strong>
        <p id="pub1_desc"></p>
        <div class="pub-links"><a href="#">PDF</a><a href="#">DOI</a><a href="#">Code</a></div>
      </article>
      <article class="pub-item">
        <strong id="pub2_title"></strong>
        <p id="pub2_desc"></p>
        <div class="pub-links"><a href="#">PDF</a><a href="#">DOI</a></div>
      </article>
      <article class="pub-item">
        <strong id="pub3_title"></strong>
        <p id="pub3_desc"></p>
        <div class="pub-links"><a href="#">PDF</a><a href="#">Project</a></div>
      </article>
    </section>

    <section id="teaching">
      <div class="section-head">
        <h2 data-i18n="teaching_title"></h2>
        <p data-i18n="teaching_subtitle"></p>
      </div>
      <div class="grid-2">
        <article class="card teaching-item">
          <h3 id="teach1"></h3>
          <p id="teach1_desc"></p>
        </article>
        <article class="card teaching-item">
          <h3 id="teach2"></h3>
          <p id="teach2_desc"></p>
        </article>
      </div>
    </section>

    <section id="news" class="card">
      <div class="section-head">
        <h2 data-i18n="news_title"></h2>
        <p data-i18n="news_subtitle"></p>
      </div>
      <div class="news-list">
        <article class="news-item" id="news1"></article>
        <article class="news-item" id="news2"></article>
        <article class="news-item" id="news3"></article>
      </div>
    </section>

    <footer id="contact">
      <div class="contact-row">
        <div id="contactLine"></div>
        <div id="linksLine"></div>
      </div>
      <div class="contact-row">
        <div>© <span id="year"></span> <span id="copyrightName">{{Your Name}}</span></div>
      </div>
    </footer>
  </main>

      }
    };

    const textIds = [
      "heroName", "heroTitle", "heroStatement", "meta1", "meta2", "meta3", "meta4", "topic1", "topic1_desc",
      "topic2", "topic2_desc", "topic3", "topic3_desc", "pub1_title", "pub1_desc", "pub2_title", "pub2_desc",
      "pub3_title", "pub3_desc", "teach1", "teach1_desc", "teach2", "teach2_desc", "news1", "news2", "news3",
      "contactLine", "linksLine", "siteName", "copyrightName"
    ];

    function applyLanguage(lang) {
      const t = translations[lang] || translations.zh;
      document.documentElement.lang = t.html_lang;
      document.title = t.page_title;

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.dataset.i18n;
        if (t[key]) el.textContent = t[key];
      });

      const map = {
        heroName: "hero_name",
        heroTitle: "hero_title",
        heroStatement: "hero_statement",
        meta1: "meta1",
        meta2: "meta2",
        meta3: "meta3",
        meta4: "meta4",
        topic1: "topic1",
        topic1_desc: "topic1_desc",
        topic2: "topic2",
        topic2_desc: "topic2_desc",
        topic3: "topic3",
        topic3_desc: "topic3_desc",
        pub1_title: "pub1_title",
        pub1_desc: "pub1_desc",
        pub2_title: "pub2_title",
        pub2_desc: "pub2_desc",
        pub3_title: "pub3_title",
        pub3_desc: "pub3_desc",
        teach1: "teach1",
        teach1_desc: "teach1_desc",
        teach2: "teach2",
        teach2_desc: "teach2_desc",
        news1: "news1",
        news2: "news2",
        news3: "news3",
        contactLine: "contact_line",
        linksLine: "links_line",
        siteName: "site_name",
        copyrightName: "site_name"
      };

      textIds.forEach((id) => {
        const el = document.getElementById(id);
        const key = map[id];
        if (el && t[key]) el.textContent = t[key];
      });

      localStorage.setItem("preferred-lang", lang);
      document.querySelectorAll(".lang-control button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
    }

    const initialLang = localStorage.getItem("preferred-lang") || (navigator.language.toLowerCase().includes("zh") ? "zh" : "en");
    applyLanguage(initialLang);

    document.querySelectorAll(".lang-control button").forEach((btn) => {
      btn.addEventListener("click", () => applyLanguage(btn.dataset.lang));
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
