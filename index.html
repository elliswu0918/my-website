<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Portfolio | {{Your Name}}</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --text: #2f2f2f;
      --muted: #6b6b6b;
      --line: #dfddd6;
      --accent: #7a8a7b;
      --accent-2: #8c7a6b;
      --font-sans: "Inter", "Noto Sans TC", "Noto Sans", "PingFang TC", system-ui, sans-serif;
      --font-serif: "Noto Serif TC", "Noto Serif", Georgia, serif;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
      --radius: 10px;
      --container: 1060px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.8;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(var(--container), 92%);
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(247, 246, 242, 0.95);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      gap: 16px;
    }

    .brand {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }

    .menu {
      display: flex;
      gap: 18px;
      font-size: 0.95rem;
      color: var(--muted);
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .lang-switch {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px;
      display: inline-flex;
      gap: 4px;
      background: var(--surface);
    }

    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.88rem;
    }

    .lang-switch button.active {
      background: var(--accent);
      color: #fff;
    }

    .hero {
      padding: 72px 0 54px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.3;
      font-weight: 600;
    }

    .subtitle {
      color: var(--muted);
      margin: 6px 0 0;
      font-size: 1.05rem;
    }

    .statement {
      font-size: 1.08rem;
      max-width: 700px;
      margin: 14px 0 0;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.92rem;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    section {
      padding: 30px 0;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(1.3rem, 2.4vw, 1.85rem);
      margin: 0 0 14px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .muted { color: var(--muted); }

    .pub-list, .news-list {
      display: grid;
      gap: 12px;
    }

    .pub-item, .news-item {
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }

    .pub-item:last-child, .news-item:last-child { border-bottom: 0; }

    .links {
      display: inline-flex;
      gap: 10px;
      color: var(--accent-2);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    footer {
      margin-top: 30px;
      border-top: 1px solid var(--line);
      padding: 22px 0 40px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 780px) {
      .menu {
        gap: 10px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand" id="brandName">{{Your Name}}</div>
      <nav class="menu">
        <a href="#home" data-i18n="navHome"></a>
        <a href="#research" data-i18n="navResearch"></a>
        <a href="#publications" data-i18n="navPublications"></a>
        <a href="#teaching" data-i18n="navTeaching"></a>
        <a href="#contact" data-i18n="navContact"></a>
        <div class="lang-switch" aria-label="Language switch">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="home" class="hero">
      <div>
        <h1 id="name">{{Your Name}}</h1>
        <p class="subtitle" id="titleLine"></p>
        <p class="statement" id="statement"></p>
        <div class="hero-actions">
          <a class="btn primary" href="#publications" data-i18n="btnPublications"></a>
          <a class="btn" href="#" data-i18n="btnCV"></a>
        </div>
      </div>
    </section>

    <section id="research">
      <h2 class="section-title" data-i18n="researchTitle"></h2>
      <div class="card-grid">
        <article class="card">
          <h3 id="topic1"></h3>
          <p class="muted" id="topic1Desc"></p>
        </article>
        <article class="card">
          <h3 id="topic2"></h3>
          <p class="muted" id="topic2Desc"></p>
        </article>
        <article class="card">
          <h3 id="topic3"></h3>
          <p class="muted" id="topic3Desc"></p>
        </article>
      </div>
    </section>

    <section id="publications">
      <h2 class="section-title" data-i18n="pubTitle"></h2>
      <div class="pub-list">
        <article class="pub-item">
          <div id="pub1"></div>
          <div class="links"><a href="#">PDF</a><a href="#">DOI</a><a href="#">Code</a></div>
        </article>
        <article class="pub-item">
          <div id="pub2"></div>
          <div class="links"><a href="#">PDF</a><a href="#">DOI</a></div>
        </article>
        <article class="pub-item">
          <div id="pub3"></div>
          <div class="links"><a href="#">PDF</a><a href="#">Project</a></div>
        </article>
      </div>
    </section>

    <section id="teaching">
      <h2 class="section-title" data-i18n="teachingTitle"></h2>
      <div class="card-grid">
        <article class="card">
          <h3 id="teach1"></h3>
          <p class="muted" id="teach1Desc"></p>
        </article>
        <article class="card">
          <h3 id="teach2"></h3>
          <p class="muted" id="teach2Desc"></p>
        </article>
      </div>
    </section>

    <section id="news">
      <h2 class="section-title" data-i18n="newsTitle"></h2>
      <div class="news-list">
        <article class="news-item" id="news1"></article>
        <article class="news-item" id="news2"></article>
        <article class="news-item" id="news3"></article>
      </div>
    </section>
  </main>

  <footer id="contact">
    <div class="container">
      <div id="contactLine"></div>
      <div id="footerLinks"></div>
      <div>© <span id="year"></span> <span id="footerName">{{Your Name}}</span></div>
    </div>
  </footer>

  <script>
    const i18n = {
      zh: {
        pageTitle: "學術個人網站 | {{Your Name}}",
        brandName: "{{Your Name}}",
        name: "{{Your Name}}",
        titleLine: "助理教授候選人｜{{Department}}, {{University}}",
        statement: "我專注於資料驅動決策、人機互動與服務創新，特別關注可解釋、可擴展且具有社會影響力的研究方法。",
        navHome: "首頁",
        navResearch: "研究",
        navPublications: "論文",
        navTeaching: "教學",
        navContact: "聯絡",
        btnPublications: "查看論文",
        btnCV: "下載 CV",
        researchTitle: "研究興趣",
        topic1: "資料驅動決策",
        topic1Desc: "結合統計建模與實務洞察，提升複雜情境中的決策品質。",
        topic2: "人機互動與 AI",
        topic2Desc: "研究可解釋與以人為中心的 AI 系統，強調可用性與倫理。",
        topic3: "服務創新與社會影響",
        topic3Desc: "探索數位服務設計如何提升公共價值與永續成果。",
        pubTitle: "代表性論文",
        pub1: "Chen, Y., <strong>{{Your Name}}</strong>, Lin, H. (2025). 多模態情緒辨識於服務互動場景之應用. Journal of Service Analytics.",
        pub2: "<strong>{{Your Name}}</strong>, Wang, C. (2024). 可解釋式推薦模型於數位平台之研究. IEEE Access.",
        pub3: "Hsu, P., <strong>{{Your Name}}</strong> (2023). 以人為中心 AI 介面對決策信任之影響. CHI Workshop.",
        teachingTitle: "教學與服務",
        teach1: "教學領域",
        teach1Desc: "資料分析、研究方法、AI 與管理決策。",
        teach2: "學術服務",
        teach2Desc: "審稿、學生指導、跨領域研究社群協作。",
        newsTitle: "最新消息",
        news1: "[2026.03] 論文〈Explainable Human-AI Decision Support〉獲 International Conference on Service Systems 接收。",
        news2: "[2026.01] 受邀於 Data & Society Seminar 發表演講。",
        news3: "[2025.11] 與跨校團隊啟動 AI 與公共服務合作計畫。",
        contactLine: "聯絡：your.email@university.edu",
        footerLinks: "ORCID ｜ Google Scholar ｜ GitHub ｜ {{Institution}}",
        htmlLang: "zh-Hant"
      },
      en: {
        pageTitle: "Academic Website | {{Your Name}}",
        brandName: "{{Your Name}}",
        name: "{{Your Name}}",
        titleLine: "Assistant Professor Candidate | {{Department}}, {{University}}",
        statement: "My research focuses on data-driven decision-making, human-AI interaction, and service innovation, with an emphasis on explainability, scalability, and social impact.",
        navHome: "Home",
        navResearch: "Research",
        navPublications: "Publications",
        navTeaching: "Teaching",
        navContact: "Contact",
        btnPublications: "View Publications",
        btnCV: "Download CV",
        researchTitle: "Research Interests",
        topic1: "Data-Driven Decision-Making",
        topic1Desc: "Combining statistical modeling with domain insights to improve decisions under complexity.",
        topic2: "Human-AI Interaction",
        topic2Desc: "Designing explainable, human-centered AI systems with usability and ethics in mind.",
        topic3: "Service Innovation & Impact",
        topic3Desc: "Investigating how digital service design can create public value and sustainable outcomes.",
        pubTitle: "Selected Publications",
        pub1: "Chen, Y., <strong>{{Your Name}}</strong>, Lin, H. (2025). Multimodal Emotion Recognition in Service Encounters. Journal of Service Analytics.",
        pub2: "<strong>{{Your Name}}</strong>, Wang, C. (2024). Explainable Recommender Models for Digital Platforms. IEEE Access.",
        pub3: "Hsu, P., <strong>{{Your Name}}</strong> (2023). Human-Centered AI Interfaces and Decision Trust. CHI Workshop.",
        teachingTitle: "Teaching & Service",
        teach1: "Teaching Areas",
        teach1Desc: "Data Analytics, Research Methods, and AI for Management.",
        teach2: "Academic Service",
        teach2Desc: "Peer reviewing, student mentoring, and interdisciplinary collaboration.",
        newsTitle: "News",
        news1: "[Mar 2026] Paper accepted to the International Conference on Service Systems.",
        news2: "[Jan 2026] Invited talk at the Data & Society Seminar.",
        news3: "[Nov 2025] Launched a cross-university AI and public service collaboration.",
        contactLine: "Contact: your.email@university.edu",
        footerLinks: "ORCID | Google Scholar | GitHub | {{Institution}}",
        htmlLang: "en"
      }
    };

    function applyLanguage(lang) {
      const t = i18n[lang] || i18n.zh;
      document.documentElement.lang = t.htmlLang;
      document.title = t.pageTitle;

      Object.entries(t).forEach(([key, value]) => {
        const nodes = document.querySelectorAll(`[data-i18n="${key}"]`);
        nodes.forEach((node) => (node.textContent = value));
      });

      const ids = [
        "brandName", "name", "titleLine", "statement", "topic1", "topic1Desc", "topic2", "topic2Desc",
        "topic3", "topic3Desc", "pub1", "pub2", "pub3", "teach1", "teach1Desc", "teach2", "teach2Desc",
        "news1", "news2", "news3", "contactLine", "footerLinks"
      ];

      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (el && t[id]) {
          if (["pub1", "pub2", "pub3"].includes(id)) {
            el.innerHTML = t[id];
          } else {
            el.textContent = t[id];
          }
        }
      });

      localStorage.setItem("site-lang", lang);
      document.querySelectorAll(".lang-switch button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
    }

    const userLang = localStorage.getItem("site-lang") || (navigator.language.toLowerCase().includes("zh") ? "zh" : "en");
    applyLanguage(userLang);

    document.querySelectorAll(".lang-switch button").forEach((btn) => {
      btn.addEventListener("click", () => applyLanguage(btn.dataset.lang));
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
